name: Final Dual Screener Verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final_dual_verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PROJECT_FABRIC_DATABASE_URL: ""
      PROJECT_FABRIC_DB_REQUIRED: "false"
      ZPI_API_KEY: "test-only"
      ZPI_BASE_URL: "https://example.invalid"
      TELEGRAM_BOT_TOKEN: "test-only"
      TELEGRAM_CHAT_ID: "test-only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile and regression
        run: |
          python -m py_compile main.py scanner/*.py storage/*.py bot/*.py
          python test_regressions.py
      - name: Validate alert formatting and six-slot budget
        run: |
          python - <<'PY'
          import config
          from main import format_flow_alert
          from scanner.confluence import score_flow_pre, score_flow_final

          assert config.MICRO_MAX_CANDIDATES == 6
          assert config.FLOW_RESERVED_SLOTS == 2
          assert config.MICRO_MAX_CANDIDATES - config.FLOW_RESERVED_SLOTS == 4

          sample = {
              "ticker": "TEST",
              "price": 100,
              "foreign_score": 92.0,
              "net_foreign_value": 200_000_000,
              "activity_spike": 3.0,
              "volume_spike": 5.0,
              "position_in_range": 0.9,
              "interval_return_pct": 0.5,
              "anti_falling_knife_pass": True,
              "not_overextended": True,
              "micro_score": 80.0,
              "aggressive_buy_ratio": 0.75,
              "bid_percent": 65.0,
              "score": 70.0,
          }
          sample["flow_pre_score"] = score_flow_pre(sample)
          score, status, reasons = score_flow_final(sample)
          sample["flow_score"] = score
          sample["flow_status"] = status
          sample["flow_reasons"] = reasons
          msg = format_flow_alert(sample, 1)

          assert score >= config.FLOW_ALERT_THRESHOLD
          assert "SCREENER 2" in msg
          assert "FLOW CONFLUENCE" in msg
          assert "Net Foreign Value" in msg
          print({"flow_pre": sample["flow_pre_score"], "flow": score, "status": status})
          PY
