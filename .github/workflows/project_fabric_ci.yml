name: Project Fabric CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-fabric-ci
  cancel-in-progress: true

jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabric -d fabric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECT_FABRIC_DATABASE_URL: postgresql://fabric:fabric@localhost:5432/fabric_test
      PROJECT_FABRIC_CACHE_NAMESPACE: phase3-ci-${{ github.run_id }}
      PROJECT_FABRIC_DB_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: pip install -r requirements.txt
      - name: Compile Project Fabric
        run: python -m compileall -q project_fabric
      - name: Framework self-check
        run: python -m project_fabric.selfcheck
      - name: Shared database migration check
        run: python -m project_fabric.db_admin migrate --require
      - name: Framework unit tests
        run: python -m unittest discover -s tests -p "test_project_fabric*.py" -v
      - name: Repository regression tests
        run: |
          python -m py_compile main.py scanner/*.py storage/*.py bot/*.py
          python test_regressions.py
