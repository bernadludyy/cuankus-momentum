name: Bot 4 Optimization Verify

on:
  push:
    paths:
      - ".optimization-test-trigger"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile and regression tests
        env:
          PROJECT_FABRIC_DATABASE_URL: ""
          PROJECT_FABRIC_DB_REQUIRED: "false"
          PROJECT_FABRIC_INTEGRATION_TESTS: "0"
        run: |
          python -m py_compile main.py scanner/*.py storage/*.py bot/*.py project_fabric/*.py
          python test_regressions.py
