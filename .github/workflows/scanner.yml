name: Cuankus Momentum Scanner

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run microstructure and Telegram smoke tests"
        required: false
        default: false
        type: boolean
      force_run:
        description: "Ignore IDX market-hours guard for manual testing"
        required: false
        default: false
        type: boolean
concurrency:
  group: cuankus-momentum-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      PROJECT_FABRIC_DB_REQUIRED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scanner DB
        uses: actions/cache/restore@v4
        with:
          path: data/cuankus_momentum.db
          key: cuankus-momentum-db-${{ github.run_id }}
          restore-keys: |
            cuankus-momentum-db-

      - name: Regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        env:
          PROJECT_FABRIC_DATABASE_URL: ""
          PROJECT_FABRIC_DB_REQUIRED: "false"
          PROJECT_FABRIC_INTEGRATION_TESTS: "0"
        run: |
          python -m py_compile main.py scanner/*.py storage/*.py bot/*.py
          python test_regressions.py

      - name: Daily MA filter smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        env:
          ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
          ZPI_BASE_URL: https://api.zapi.ink/v1/finance:pluang
          ZPI_IDX_BASE_URL: https://api.zapi.ink/v1/finance:idx
          DAILY_FILTER_ENABLED: "true"
          VOLUME_MA_SHORT: "10"
          VOLUME_MA_LONG: "100"
          VOLUME_MA_RATIO_MIN: "2.0"
          VALUE_MA_WINDOW: "5"
          MIN_VALUE_MA_IDR: "500000000"
        run: python test_daily_filter.py

      - name: Shareholder filter smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        env:
          ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
          ZPI_BASE_URL: https://api.zapi.ink/v1/finance:pluang
          ZPI_IDX_BASE_URL: https://api.zapi.ink/v1/finance:idx
        run: python test_shareholder_filter.py

      - name: Microstructure smoke test
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        env:
          ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
          ZPI_BASE_URL: https://api.zapi.ink/v1/finance:pluang
          RUNNING_TRADE_MIN_LOT: "100"
          RUNNING_TRADE_MAX_AGE_MINUTES: "15"
          BIG_PRINT_MIN_LOT: "500"
        run: python test_microstructure.py

      - name: Telegram delivery smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python test_telegram.py
      - name: Run scanner
        env:
          ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
          ZPI_BASE_URL: https://api.zapi.ink/v1/finance:pluang
          ZPI_IDX_BASE_URL: https://api.zapi.ink/v1/finance:idx
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          ZPI_QUOTE_PATH: quote
          ZPI_SUMMARY_PATH: summary

          USE_MULTI_QUOTE: "true"
          BATCH_SIZE: "20"
          TOP_MOVER_COUNT: "50"
          MICRO_MAX_CANDIDATES: "6"
          MICRO_MIN_PRE_SCORE: "35"
          MICRO_MIN_CONFIRM_SCORE: "45"
          IGNITION_RESERVED_SLOTS: "2"
          IGNITION_THRESHOLD: "65"
          IGNITION_MIN_VOLUME_SPIKE: "3.0"
          IGNITION_MIN_MICRO_SCORE: "55"
          IGNITION_MIN_AGGRESSIVE_BUY: "0.65"
          IGNITION_MIN_INTERVAL_RETURN_PCT: "-0.30"
          IGNITION_MAX_INTERVAL_RETURN_PCT: "1.50"
          IGNITION_MAX_DAILY_CHANGE_PCT: "4.0"
          RUNNING_TRADE_MIN_LOT: "100"
          RUNNING_TRADE_MAX_AGE_MINUTES: "15"
          BIG_PRINT_MIN_LOT: "500"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run && 'true' || 'false' }}
          RECENT_SNAPSHOTS: "12"
          MIN_BASELINE_INTERVALS: "4"

          LEAKAGE_THRESHOLD: "70"
          MOMENTUM_THRESHOLD: "80"
          PRE_MOMENTUM_THRESHOLD: "65"
          PRE_MOMENTUM_MIN_MICRO_SCORE: "55"
          PRE_MOMENTUM_MIN_AGGRESSIVE_BUY: "0.60"
          PRE_MOMENTUM_MIN_INTERVAL_RETURN_PCT: "0.10"
          PRE_MOMENTUM_MIN_BREAKOUT_PCT: "-0.30"
          PRE_MOMENTUM_MIN_POSITION_IN_RANGE: "0.70"
          ALERT_COOLDOWN_MINUTES: "30"
          SIGNAL_REARM_MINUTES: "15"
          MARKET_CAP_FILTER_ENABLED: "true"
          MIN_MARKET_CAP_IDR: "100000000000"
          MAX_MARKET_CAP_IDR: "10000000000000"
          MARKET_CAP_CACHE_HOURS: "24"
          MAX_ALERT_PRICE: "500"
          DAILY_FILTER_ENABLED: "true"
          VOLUME_MA_SHORT: "10"
          VOLUME_MA_LONG: "100"
          VOLUME_MA_RATIO_MIN: "2.0"
          VALUE_MA_WINDOW: "5"
          MIN_VALUE_MA_IDR: "500000000"
          DAILY_FILTER_CACHE_HOURS: "18"
          STOCK_HISTORY_LENGTH: "120"
          SHAREHOLDER_FILTER_ENABLED: "false"
          MAX_SHAREHOLDERS: "5000"
          SHAREHOLDER_CACHE_HOURS: "168"
          SHAREHOLDER_FAILURE_CACHE_HOURS: "6"
          SHAREHOLDER_ANNOUNCEMENT_LENGTH: "50"

          MIN_DAILY_CHANGE_FOR_LEAKAGE: "-2.0"
          MAX_DAILY_CHANGE_FOR_LEAKAGE: "4.0"
          MAX_DAILY_CHANGE_FOR_MOMENTUM: "10.0"

          MIN_ACTIVITY_SPIKE: "1.5"
          MIN_BREAKOUT_PCT: "0.30"
          MIN_MOMENTUM_INTERVAL_RETURN_PCT: "0.35"

          DB_PATH: data/cuankus_momentum.db
        run: python main.py

      - name: Save scanner DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cuankus_momentum.db
          key: cuankus-momentum-db-${{ github.run_id }}

      - name: Phase 4 run finish
        if: always()
        env:
          FABRIC_JOB_STATUS: ${{ job.status }}
        run: python -m project_fabric.observability run-finish --service cuankus-momentum --status "$FABRIC_JOB_STATUS" --require
