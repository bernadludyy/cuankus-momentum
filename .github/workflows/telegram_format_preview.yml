name: Bot 4 Telegram Format Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram_format_preview.yml"

permissions:
  contents: read

concurrency:
  group: bot4-telegram-format-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROJECT_FABRIC_DATABASE_URL: ""
      PROJECT_FABRIC_DB_REQUIRED: "false"
      PROJECT_FABRIC_INTEGRATION_TESTS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Bot 4 formatter
        run: python -m py_compile main.py scanner/*.py storage/*.py bot/*.py

      - name: Send Telegram format preview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python test_telegram.py
