name: Export Bot 4 Telegram Alerts

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date in WIB (YYYY-MM-DD)"
        required: true
        default: "2026-10-02"
        type: string
      end_date:
        description: "End date in WIB (YYYY-MM-DD)"
        required: true
        default: "2026-10-06"
        type: string
  push:
    branches:
      - main
    paths:
      - "scripts/export_bot4_alerts.py"
      - ".github/workflows/export_bot4_alerts.yml"

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      PROJECT_FABRIC_DB_REQUIRED: "true"
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      ZPI_BASE_URL: https://api.zapi.ink/v1/finance:pluang
      ZPI_IDX_BASE_URL: https://api.zapi.ink/v1/finance:idx
      PYTHONPATH: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner DB
        uses: actions/cache/restore@v4
        with:
          path: data/cuankus_momentum.db
          key: cuankus-momentum-export-${{ github.run_id }}
          restore-keys: |
            cuankus-momentum-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export successful Telegram deliveries
        run: |
          python scripts/export_bot4_alerts.py \
            --start-date "${{ github.event.inputs.start_date || '2026-10-02' }}" \
            --end-date "${{ github.event.inputs.end_date || '2026-10-06' }}" \
            --scanner-db "data/cuankus_momentum.db" \
            --output "artifacts/bot4-alerts-2026-10-02-to-2026-10-06.json"

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: bot4-alerts-2026-10-02-to-2026-10-06
          path: |
            artifacts/bot4-alerts-2026-10-02-to-2026-10-06.json
            data/cuankus_momentum.db
          if-no-files-found: error
          retention-days: 7
